version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: intelliassess-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=intelliassess

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliassess-backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=intelliassess
      - LLM_PROVIDER=ollama
      - OLLAMA_MODEL=llama3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelliassess-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
